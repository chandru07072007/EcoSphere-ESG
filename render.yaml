services:
  # ── BACKEND WEB SERVICE ──────────────────────────────────────────────────────
  - type: web
    name: ecosphere-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false
        description: "MongoDB connection string (e.g., MongoDB Atlas connection string)"
      - key: DB_NAME
        value: odoo
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        value: https://ecosphere-frontend.onrender.com

  # ── FRONTEND STATIC SITE ─────────────────────────────────────────────────────
  - type: web
    name: ecosphere-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://ecosphere-backend.onrender.com
    routes:
      # Rewrite all routes to index.html for Single Page Application (SPA) routing
      - type: rewrite
        source: /*
        destination: /index.html
